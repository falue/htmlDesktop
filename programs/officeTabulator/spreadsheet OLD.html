<!DOCTYPE html>
  <head>
    <meta charset="UTF-8" />
    <title>SPREADSHEET</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- style and script resources -->
    <link rel="stylesheet" type="text/css" href="../../tools/fonts.css" media="all">
    <link rel="stylesheet" href="../../tools/general.css" media="all">
    <link rel="stylesheet" href="../../tools/desktop.css" media="all">
    <!-- <link rel="stylesheet" href="stylesheet.css" media="all"> -->
    <link rel="stylesheet" href="spreadsheet.css" media="all">
    <script src="../../tools/general.js"></script>
    <script src="javascript.js"></script>
    <script src="spreadsheet.js" defer></script>

  </head>
  <body id="body" onload="setup();" onkeydown="parent.keyboardController(event);">
    <div class="nobr maxWidth maxHeight" style="overflow:auto;">
      <table id="spreadsheet">
          <thead>
              <tr>
                  <th>Column 1</th>
                  <th>Column 2</th>
                  <th>Column 3</th>
              </tr>
          </thead>
          <tbody>
              <tr>
                  <td><input type="text" value="Value 1"></td>
                  <td><input type="text" value="Value 2"></td>
                  <td><input type="text" value="Value 3"></td>
              </tr>
              <tr>
                  <td><input type="text" value="Value 4"></td>
                  <td><input type="text" value="Value 5"></td>
                  <td><input type="text" value="Value 6"></td>
              </tr>
          </tbody>
      </table>

      <hr>

      <h3>add csv:</h3>
      <input type="file" id="csvFile" accept=".csv" />
      <br><br>
      
    </div>
  </body>
  </html>
