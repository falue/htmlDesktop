<!DOCTYPE html>
<html lang="en">
	<head>
		<title>BOAR</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">

		<style>

			/* GUI OVERWRIE */
			.lil-gui input[type=checkbox]:focus {
				outline: none;
			}
			.lil-gui input[type=checkbox] {
				width: inherit;
			}
			.lil-gui input[type=checkbox]:focus {
				box-shadow: none;
			}
			.lil-gui input[type=checkbox]:after {
				content: "Toggle";
				color:rgba(255,255,255,.5);
			}
			.lil-gui input[type=checkbox]:checked {
				/* this is shit because it should be radios not checkboxes for only allowing one checked checkbox at a time */
				/* background-color: red; */
			}
			.lil-gui input[type=checkbox]:checked:after {
				padding: 0;
			}
			.lil-gui input[type=checkbox]:checked:before {
				content:"";
				display:none;
			}

			/* LABELS */
			#c {
				width: 100vw;
				height: 100vh;
				width: 100%;  /* let our container decide our size */
				height: 100%;
				display: block;
			}
			#container {
				position: relative;  /* makes this the origin of its children */
				width: 100vw;
				height: 100vh;
				overflow: hidden;
			}
			#labels {
				position: absolute;  /* let us position ourself inside the container */
				left: 0;             /* make our position the top left of the container */
				top: 0;
				color: white;
				display: none;
				font-family: apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
			}
			#labels>div {
				position: absolute;  /* let us position them inside the container */
				left: 0;             /* make their default position the top left of the container */
				top: 0;
				cursor: pointer;     /* change the cursor to a hand when over us */
				font-size: large;
				color: rgb(255, 255, 255);
				background-color:black;
				user-select: none;   /* don't let the text get selected */
				padding:2px 6px;
				border: solid rgb(255, 255, 255) 1px;
			}
			#labels>div:before {
				content: "x";
				position: absolute;
				color:transparent;
				border-top: solid rgb(255, 255, 255) 1px;
				width:50px;
				transform: rotate(-45deg);
				top:41.5px;
				left:-34px;
			}
			#labels>div:hover {
				color: white;
			}
		</style>
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> ELCH Sz 67 Test<br />
			LOG
		</div>

		<div id="labels"></div>

		<!-- Import maps polyfill -->
		<!-- Remove this when import maps will be widely supported -->
		<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import Stats from './jsm/libs/stats.module.js';

			import { GUI } from './jsm/libs/lil-gui.module.min.js';
			import { OrbitControls } from './jsm/controls/OrbitControls.js';
			import { FBXLoader } from './jsm/loaders/FBXLoader.js';

			let camera, scene, renderer, stats;

			const clock = new THREE.Clock();
			const effectController = {"SlowMo" :0};

			// FPS stats true or false
			const enableStats = false;
			let delta = 0;
			let lag = 0.33;  // fps
			
			let mixer, mixer2, mixer3, mixer4, mixer6;
			

			// Reihenfolge bestimmt welches label wo ist
			let labels = ["agent", "log"];


			init();
			animate();

			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.01, 15000 );
				camera.position.set( 500, 500, 2000 );
		

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x000000 );
				scene.fog = new THREE.Fog( 0x333333, 100, 5000 );

				// lights

				const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444 );
				hemiLight.position.set( 0, 2000, 0 );
				scene.add( hemiLight );

				const dirLight = new THREE.DirectionalLight( 0xffffff );
				dirLight.position.set( 0, 2000, 1000 );
				dirLight.castShadow = true;
				dirLight.shadow.camera.top = 180;
				dirLight.shadow.camera.bottom = - 100;
				dirLight.shadow.camera.left = - 120;
				dirLight.shadow.camera.right = 120;
				scene.add( dirLight );

				// materials

				const material1 = new THREE.MeshPhysicalMaterial( {	color: 0x5f5e22, metallness: 0, wireframe:true } );
				const charactermaterial = new THREE.MeshPhysicalMaterial( {	color: 0xff6600, metallness: 0, wireframe:false} );
				const charactermaterial2 = new THREE.MeshPhysicalMaterial( {	color: 0x6666ff, metallness: 0, wireframe:false} );
				const plantsmaterial = new THREE.MeshPhysicalMaterial( {	color: 0x42803e, metallness: 0, wireframe:true } );
				const laptopmaterial = new THREE.MeshPhysicalMaterial( {color:0xdbfc03, wireframe:true});
				const boundingboxmaterial = new THREE.MeshPhysicalMaterial( {color: 0xffffff, metallness:1, wireframe:true});
				const watermaterial = new THREE.MeshPhysicalMaterial( {color:0x1593d6, metallness:1, wireframe:true});
	
			
				// Scenery

				const loader = new FBXLoader();
				loader.load( 'models/fbx/boar2_water.fbx', function ( object ) {
					mixer4 = new THREE.AnimationMixer( object );

					mixer4.timeScale = 0;

					const action4 = mixer4.clipAction( object.animations[ 0 ] );
					action4.play();
	
					object.traverse( function ( child ) {

						if ( child.isMesh ) {
							child.material = watermaterial;
							child.frustumCulled = false;

						}
					} );
					
					scene.add( object );
					object.position.set(0, -99, 3165);
					
				} );

				const loader1 = new FBXLoader();
				loader1.load( 'models/fbx/boar2_Plants.fbx', function ( object3 ) {
				
					object3.traverse( function ( child ) {

						if ( child.isMesh ) {
						child.material = plantsmaterial;

						}
					} );
					
					scene.add( object3 );
					
				} );

				const loader3 = new FBXLoader();
				loader3.load('models/fbx/boar2_land.fbx', function ( object4 ) {
					object4.traverse( function ( child ) {
						if (child.isMesh ) {
							child.material = material1;
						}
					});
					scene.add( object4 );
				});


				//Laptop

				const laptopgeometry = new THREE.BoxGeometry( 40, 6, 20 );
				const laptop = new THREE.Mesh( laptopgeometry, laptopmaterial );
				scene.add( laptop );
				laptop.position.set(132, 20, 358 );
				laptop.rotation.set(THREE.Math.degToRad(-13),THREE.Math.degToRad(-6), 0);

				//Animation 1

				const loader2 = new FBXLoader();
				loader2.load('models/fbx/boar2_characterUE.fbx', function ( object2 ) {

					mixer = new THREE.AnimationMixer( object2 );

					//Animationsgeschwindigkeit am Anfang
					mixer.timeScale = 0;
					

					const action = mixer.clipAction( object2.animations[ 0 ] );
					action.play();
					
					object2.traverse( function ( child ) {
						if ( child.isMesh ) {
							
							child.material = charactermaterial;
							child.frustumCulled = false;
							
						}
					
					} );
					scene.add( object2 );
					object2.rotation.set(Math.PI/2, Math.PI, Math.PI/2);
					object2.position.set(143,8,316);

					// Autoplay on load
					modifyTimeScale(1);
				});
				
		
				//Boundingboxes

				const loader6 = new FBXLoader();
				loader6.load('models/fbx/boar2_boundingbox.fbx', async function ( object6 ) {

				/*	mixer6 = new THREE.AnimationMixer( object6 );
					mixer6.timeScale = 0;
					

					const action6 = mixer6.clipAction( object6.animations[ 0 ] );
					action6.play();*/
					
					object6.traverse( function ( child ) {
						if ( child.isMesh ) {
							
							child.material = boundingboxmaterial;
							child.frustumCulled = false;
						}
					
					} );
					scene.add( object6 );
					// Nicht sichtbar am Anfang
					object6.visible = false;
					// once loading of bounding boxes is finished, set up labels
					// createTextLabels('Boar', 7);
					createBoundBoxesLabels();
				});

				function createBoundBoxesLabels () {
					//BoundingBoxes & labels
					const labelContainerElem = document.querySelector('#labels');

					// Make diov for every label
					for(let i = 0; i < labels.length; i++) {
						let elem = document.createElement('div');
						elem.textContent = labels[i];
						elem.id = "label-"+i;
						labelContainerElem.prepend(elem);
					}
				}

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				container.appendChild( renderer.domElement );

				const controls = new OrbitControls( camera, renderer.domElement );
				
				//Mittelpunkt von Kamerasicht
				controls.target.set( 150, 0, 300 );
				controls.update();

				const gui = new GUI( {} );
				gui.domElement.id = 'gui';
				
				// Slider: Fast-reverse, reverse, pause, play, f-forward
				gui.add({"Scrubbing": 1}, 'Scrubbing', -3, 3).step(1).onChange(
					function (value) {
						if(value === -2) value = -5;  // Make -2 go faster
						if(value === 2) value = 5;    // Make  2 go faster
						if(value === -3) value = -10;  // Make -3 go brrr
						if(value === 3) value = 10;    // Make  3 go brrr
						modifyTimeScale(value);
					}
				);

				// Checkbox: Play / Pause
				gui.add({"Play / Pause": true}, "Play / Pause").onChange( modifyTimeScale );

				// Checkbox: Pause
				gui.add({"Pause": false}, "Pause").onChange( function () { modifyTimeScale(false) } );
				
				// Slider: Scrubbing
				gui.add(effectController, 'SlowMo', -1, 1).onChange( modifyTimeScale );

				// Checkbox: Reverse play or pause
				gui.add({"Reverse": false}, "Reverse").onChange(
					function (value) {
						modifyTimeScale(value ? -1 : 0);
					}
				);
				
				// Checkbox: Fast forward
				gui.add({"Fast forward": false}, "Fast forward").onChange( 
					function (value) {
						modifyTimeScale(value ? 10 : 0);
					}
				);
				
				// Checkbox: Fast reverse
				gui.add({"Fast reverse": false}, "Fast reverse").onChange( 
					function (value) {
						modifyTimeScale(value ? -10 : 0);
					}
				);

				//Checkbox Boundingbox
				gui.add({"Boundingbox": false}, "Boundingbox").onChange(
					function (value) {
						showBoundingbox(value);
						showTextLabels(value);
					}
				);

				window.addEventListener( 'resize', onWindowResize );

				// stats
				if(enableStats) {
					stats = new Stats();
					container.appendChild( stats.dom );
				}

				// Lag
				gui.add({"Memory": lag}, 'Memory', 0.03, 1).onChange( function (value) { lag = value } );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}


			// Abspielgeschwindigkeit festlegen

			function modifyTimeScale( speed ) {
				mixer.timeScale = speed;
			/*	mixer2.timeScale = speed;
				mixer3.timeScale = speed; */
				mixer4.timeScale = speed;
			/*	mixer6.timeScale = speed;*/
			}
		

			function showBoundingbox (visibility) {
				/*
					scene.children[0] => hemisphereLight (name='')
					scene.children[1] => directionalLight (name='')
					scene.children[2] => feuerstelle (name='')
					scene.children[3] => irgendwie auch licht (name=land)
					scene.children[4] => untergrund/bocen & fort (name=Explosions)
					scene.children[5] => boundingboxes (name=boundingbox)
					scene.children[6] => bäume (name=plants)
					scene.children[7] => "sonny" (name=1)
					scene.children[8] => "das wesen" (name=2)
				*/

				// Hardcoded - index '5' changes when new objects/meshes/whatever are added
				// scene.children[5].visible = visibility;

				// Search object scene.children where name is 'boundingbox'
				scene.children[scene.children.map(function(e) { return e.name; }).indexOf('boundingbox')].visible = visibility;
			}

			function showTextLabels(value) {
				if(value) {
					document.getElementById('labels').style.display = 'block';
				} else {
					document.getElementById('labels').style.display = 'none';
				}
			}


			function animate() {
				requestAnimationFrame( animate );
				delta += clock.getDelta();

				if (delta  > lag) {
					if ( mixer ) mixer.update( delta );
					/*if ( mixer2 ) mixer2.update( delta );
					if ( mixer3 ) mixer3.update( delta );*/
					if ( mixer4 ) mixer4.update( delta );
					/*if ( mixer6 ) mixer6.update( delta );*/
					renderer.render( scene, camera );
					updateLabels();
					delta = 0;
					
					if(enableStats) {
						stats.update();
					}
				}
			}

			document.onkeydown = function (e) {
				if (e.key === "r") {
					camera.position.set(300, 600, 600);
					/*camera.rotation.set(1, 1, 1);*/
				} else if (e.key === "e") {
					camera.position.set(400, 800, 800);
				} else if (e.key === "p") {
					scene.background = new THREE.Color( 0xff00d0 );
				}
			}

			document.onkeyup = function (f) {
				if (f.key === "p") {
					scene.background = new THREE.Color( 0x000000 );
				}
			}


			function updateLabels() {
				const tempV = new THREE.Vector3();
				for(let i = 0; i < labels.length; i++) {					
					const elem = document.getElementById('label-'+i);
					
					// get the position of the center of the cube
					let objectToFollow = scene.children[scene.children.map(function(e) { return e.name; }).indexOf('boundingbox')];
					if(objectToFollow) {  // Objects may not yet exist
						objectToFollow.children[i].updateWorldMatrix(true, false);
						objectToFollow.children[i].getWorldPosition(tempV);
					
						// get the normalized screen coordinate of that position
						// x and y will be in the -1 to +1 range with x = -1 being
						// on the left and y = -1 being on the bottom
						tempV.project(camera);
						
						// convert the normalized position to CSS coordinates
						const x = (tempV.x *  .5 + .5) * renderer.domElement.clientWidth;
						const y = (tempV.y * -.5 + .5) * renderer.domElement.clientHeight;

					/*	if(parseInt(objectToFollow.children[i].position.x) == -1261) {
							elem.style.display = 'none';
						} else {
							elem.style.display = 'block';
						}*/
						
						// move the elem to that position
						// elem.style.transform = `translate(-50%, -50%) translate(${x}px,${y}px)`;
						elem.style.transform = `translate(-50%, -50%) translate(${x+70}px,${y-50}px)`;
					}

				};
			}

		</script>

	</body>
</html>
