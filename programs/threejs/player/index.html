<!DOCTYPE html>
<html lang="en">
  <head>
    <title>file loader</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link type="text/css" rel="stylesheet" href="main.css" />

    <script>
      let availableFiles = {
        "SZ42 - Boar": "webgl_loader_fbx_PP.html",
        "SZ42 - Island drowning thing": "ELCH_FullIsland_SZ42.html",
        "SZ34 - Island paths": "ELCH_FullIsland.html",
        "SZ67 - Beach typing": "ELCH_Sz67.html",
      };

      let peek = {
        /* "insel look": "webgl_geometry_extrude_shapes2.html",
        "webcam dome": "webgl_materials_video_webcam.html",
        "multiple scene slider": "webgl_multiple_scenes_comparison.html",
        "shader ocean": "webgl_shaders_ocean.html",
        "edge detection": "webgl_postprocessing_sobel.html",
        "unreal bloom": "webgl_postprocessing_unreal_bloom.html",
        "postprocessing": "webgl_postprocessing.html", */
      };

      // Get modelPath from URL
      const queryString = window.location.search;
      const urlParams = new URLSearchParams(queryString);
      let fileName = urlParams.get("file");
      if (fileName) {
        window.location.href = fileName;
      }
    </script>
    <style>.hide { display: none; }</style>
  </head>
  <body style="padding: 2em">
    <h1>Available models</h1>
    <ol id="modelList"></ol>
    <br>
    <h3 class="hide">Peek list</h3>
    <ul id="peekList" class="hide"></ul>
    <br>
    <script>
      if (!fileName) {
        // Fill list with available models
        let modelList = document.getElementById("modelList");
        let peekList = document.getElementById("peekList");

        // Cycle through object with keys
        for (let key in availableFiles) {
          let li = document.createElement("li");
          let a = document.createElement("a");
          a.innerHTML = `${key} <span style="color:grey">${availableFiles[key]}</span>`;
          a.href = availableFiles[key];
          li.appendChild(a);
          modelList.appendChild(li);
        }
        for (let key in peek) {
          let li = document.createElement("li");
          let a = document.createElement("a");
          a.innerHTML = `${key} <span style="color:grey">${peek[key]}</span>`;
          a.href = peek[key];
          li.appendChild(a);
          peekList.appendChild(li);
        }
        if(peek.length) {
          peekList.classList.remove('hide');
        }
      }
    </script>
  </body>
</html>
