<!DOCTYPE html>
<html lang="en">
	<head>
		<title>BOAR</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> ELCH Sz 42 Test<br />
			BOAR

		<!-- Import maps polyfill -->
		<!-- Remove this when import maps will be widely supported -->
		<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import Stats from './jsm/libs/stats.module.js';

			import { GUI } from './jsm/libs/lil-gui.module.min.js';
			import { OrbitControls } from './jsm/controls/OrbitControls.js';
			import { FBXLoader } from './jsm/loaders/FBXLoader.js';

			let camera, scene, renderer, stats;

			const clock = new THREE.Clock();
			const effectController = {Speed :0};

			// FPS stats true or false
			const enableStats = false;
			
			let mixer, mixer2, mixer3, mixer4, mixer6;


			init();
			animate();

			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.01, 15000 );
				camera.position.set( 500, 2000, 2000 );
		

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x000000 );
				scene.fog = new THREE.Fog( 0x333333, 100, 5000 );

				// lights

				const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444 );
				hemiLight.position.set( 0, 2000, 0 );
				scene.add( hemiLight );

				const dirLight = new THREE.DirectionalLight( 0xffffff );
				dirLight.position.set( 0, 2000, 1000 );
				dirLight.castShadow = true;
				dirLight.shadow.camera.top = 180;
				dirLight.shadow.camera.bottom = - 100;
				dirLight.shadow.camera.left = - 120;
				dirLight.shadow.camera.right = 120;
				scene.add( dirLight );

				// materials

				const material1 = new THREE.MeshPhysicalMaterial( {	color: 0x4d4732, metallness: 0, wireframe:true } );
				const charactermaterial = new THREE.MeshPhysicalMaterial( {	color: 0xff6600, metallness: 0, wireframe:false} );
				const charactermaterial2 = new THREE.MeshPhysicalMaterial( {	color: 0x6666ff, metallness: 0, wireframe:false} );
				const plantsmaterial = new THREE.MeshPhysicalMaterial( {	color: 0x42803e, metallness: 0, wireframe:true } );
				const firematerial = new THREE.MeshPhysicalMaterial( {color:0xdbfc03, wireframe:true});
				const boundingboxmaterial = new THREE.MeshPhysicalMaterial( {color: 0xffffff, metallness:1, wireframe:true});
	
			
				// Scenery

				const loader = new FBXLoader();
				loader.load( 'models/fbx/boar_Land2.fbx', function ( object ) {
					mixer4 = new THREE.AnimationMixer( object );

					mixer4.timeScale = 0;

					const action4 = mixer4.clipAction( object.animations[ 0 ] );
					action4.play();
	
					object.traverse( function ( child ) {

						if ( child.isMesh ) {
							child.material = material1;
							child.frustumCulled = false;

						}
					} );
					
					scene.add( object );
					
				} );

				const loader1 = new FBXLoader();
				loader1.load( 'models/fbx/boar_Plants.fbx', function ( object3 ) {
				
					object3.traverse( function ( child ) {

						if ( child.isMesh ) {
						child.material = plantsmaterial;

						}
					} );
					
					scene.add( object3 );
					
				} );


				//Fire

				const firegeometry = new THREE.ConeGeometry( 80, 80, 4, 1 );
				const fire = new THREE.Mesh( firegeometry, firematerial );
				scene.add( fire );
				fire.position.x = 100;
				fire.position.y = 70;

				//Animation 1

				const loader2 = new FBXLoader();
				loader2.load('models/fbx/bonesTest5Out_1.fbx', function ( object2 ) {

					mixer = new THREE.AnimationMixer( object2 );

					//Animationsgeschwindigkeit am Anfang
					mixer.timeScale = 0;
					

					const action = mixer.clipAction( object2.animations[ 0 ] );
					action.play();
					
					object2.traverse( function ( child ) {
						if ( child.isMesh ) {
							
							child.material = charactermaterial;
							child.frustumCulled = false;
							
						}
					
					} );
					scene.add( object2 );
				});
				
				//Animation 2

				const loader3 = new FBXLoader();
				loader3.load('models/fbx/bonesTest5Out_2.fbx', function ( object5 ) {

					mixer2 = new THREE.AnimationMixer( object5 );

					//Animationsgeschwindigkeit am Anfang
					mixer2.timeScale = 0;
					

					const action2 = mixer2.clipAction( object5.animations[ 0 ] );
					action2.play();
					
					object5.traverse( function ( child ) {
						if ( child.isMesh ) {
							
							child.material = charactermaterial2;
							child.frustumCulled = false;
							
						}
					
					} );
					scene.add( object5 );
				});

				//Explosion
				
				const loader4 = new FBXLoader();
				loader4.load('models/fbx/boar_explosion.fbx', function ( object4 ) {

					mixer3 = new THREE.AnimationMixer( object4 );

					//Animationsgeschwindigkeit am Anfang
					mixer3.timeScale = 0;
					

					const action3 = mixer3.clipAction( object4.animations[ 0 ] );
					action3.play();
					
					object4.traverse( function ( child ) {
						if ( child.isMesh ) {
							
							child.material = firematerial;
							child.frustumCulled = false;
							
						}
					
					} );
					scene.add( object4 );
				});


				//BoundingBoxes

				const loader6 = new FBXLoader();
				loader6.load('models/fbx/boar_boundingbox.fbx', function ( object6) {

					mixer6 = new THREE.AnimationMixer( object6 );
					mixer6.timeScale = 0;
					

					const action6 = mixer6.clipAction( object6.animations[ 0 ] );
					action6.play();
					
					object6.traverse( function ( child ) {
						if ( child.isMesh ) {
							
							child.material = boundingboxmaterial;
							child.frustumCulled = false;
	
						}
					
					} );
					scene.add( object6 );
					// Nicht sichtbar am Anfang
					object6.visible = false;
				});

		
				



				//Bounding Box, muss irgendwie upgedated werden um auf animiertes Objekt angewendet zu werden
				/*var box3 = new THREE.Box3().setFromObject(object6);
				scene.add(new THREE.Box3Helper(box3, 0xFF0000));*/


				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				container.appendChild( renderer.domElement );
			



				const controls = new OrbitControls( camera, renderer.domElement );
				
				//Mittelpunkt von Kamerasicht
				controls.target.set( -1200, -400, 0 );
				controls.update();

				const gui = new GUI( {} );
				gui.domElement.id = 'gui';
			
				//Checkbox Boundingbox
				gui.add({"Boundingbox": false}, "Boundingbox").onChange( showBoundingbox );
		
			
				// Checkbox: Play / pause
				gui.add({"Play / pause": false}, "Play / pause").onChange( modifyTimeScale );
				
				// Slider: Scrubbing
				gui.add(effectController, 'Speed', -10, 10).onChange( modifyTimeScale );
				
				// Slider: Fast-reverse, reverse, pause, play, f-forward
				gui.add({"Reverse pause play": 0}, 'Reverse pause play', -2, 2).step(1).onChange(
					function (value) {
						if(value === -2) value = -10;  // Make -2 go brrr
						if(value === 2) value = 10;    // Make  2 go brrr
						modifyTimeScale(value);
					}
				);

				// Checkbox: Reverse play or pause
				gui.add({"Reverse": false}, "Reverse").onChange(
					function (value) {
						modifyTimeScale(value ? -1 : 0);
					}
				);
				
				// Checkbox: Fast forward
				gui.add({"Fast forward": false}, "Fast forward").onChange( 
					function (value) {
						modifyTimeScale(value ? 10 : 0);
					}
				);
				
				// Checkbox: Fast reverse
				gui.add({"Fast reverse": false}, "Fast reverse").onChange( 
					function (value) {
						modifyTimeScale(value ? -10 : 0);
					}
				);

				window.addEventListener( 'resize', onWindowResize );

				// stats
				if(enableStats) {
					stats = new Stats();
					container.appendChild( stats.dom );
				}

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}


			// Abspielgeschwindigkeit festlegen

			function modifyTimeScale( speed ) {
				mixer.timeScale = speed;
				mixer2.timeScale = speed;
				mixer3.timeScale = speed;
				mixer4.timeScale = speed;
				mixer6.timeScale = speed;
			}
			
			//hier sollte ja irgendwie hinundher getoggelt werden, nicht einfach visible machen. gibt aber kein true/false sondern visibility/false

			function showBoundingbox (visibility) {
				/*
					scene.children[0] => hemisphereLight (name='')
					scene.children[1] => directionalLight (name='')
					scene.children[2] => feuerstelle (name='')
					scene.children[3] => irgendwie auch licht (name=land)
					scene.children[4] => untergrund/bocen & fort (name=Explosions)
					scene.children[5] => boundingboxes (name=boundingbox)
					scene.children[6] => bäume (name=plants)
					scene.children[7] => "sonny" (name=1)
					scene.children[8] => "das wesen" (name=2)
				*/

				// Hardcoded - index '5' changes when new objects/meshes/whatever are added
				// scene.children[5].visible = visibility;

				// Search object scene.children where name is 'boundingbox'
				scene.children[scene.children.map(function(e) { return e.name; }).indexOf('boundingbox')].visible = visibility;
			}
	


			function animate() {


				requestAnimationFrame( animate );

				const delta = clock.getDelta();

		


				if ( mixer ) mixer.update( delta );
				if ( mixer2 ) mixer2.update( delta );
				if ( mixer3 ) mixer3.update( delta );
				if ( mixer4 ) mixer4.update( delta );
				if ( mixer6 ) mixer6.update( delta );

				renderer.render( scene, camera );

				if(enableStats) {
					stats.update();
				}

			}

		</script>

	</body>
</html>
