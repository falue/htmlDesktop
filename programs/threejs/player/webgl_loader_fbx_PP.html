<!DOCTYPE html>
<html lang="en">
	<head>
		<title>BOAR</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">

		<style>
			body {
				font-family: 'Courier New', Courier, monospace;
				background-color: #fffe32;
			}

			/* GUI OVERWRIE */
			.lil-gui input[type=checkbox]:focus {
				outline: none;
			}
			.lil-gui input[type=checkbox] {
				width: inherit;
			}
			.lil-gui input[type=checkbox]:focus {
				box-shadow: none;
			}
			.lil-gui input[type=checkbox]:after {
				content: "Toggle";
				color:rgba(255,255,255,.5);
			}
			.lil-gui input[type=checkbox]:checked {
				/* this is shit because it should be radios not checkboxes for only allowing one checked checkbox at a time */
				/* background-color: red; */
			}
			.lil-gui input[type=checkbox]:checked:after {
				padding: 0;
			}
			.lil-gui input[type=checkbox]:checked:before {
				content:"";
				display:none;
			}

			/* LABELS */
			#c {
				width: 100vw;
				height: 100vh;
				width: 100%;  /* let our container decide our size */
				height: 100%;
				display: block;
			}
			#container {
				position: relative;  /* makes this the origin of its children */
				width: 100vw;
				height: 100vh;
				overflow: hidden;
			}
			#labels {
				position: absolute;  /* let us position ourself inside the container */
				left: 0;             /* make our position the top left of the container */
				top: 0;
				color: white;
				display: none;
				z-index: 99;
			}
			#labels>div {
				position: absolute;  /* let us position them inside the container */
				left: 0;             /* make their default position the top left of the container */
				top: 0;
				min-width:42px;
				cursor: pointer;     /* change the cursor to a hand when over us */
				font-size: 10px;
				color: rgb(255, 255, 255);
				background-color:black;
				user-select: none;   /* don't let the text get selected */
				padding:0px 10px;
				font-weight:bold;
				pointer-events: none;
			}
			#labels>div:before {
				content: "x";
				position: absolute;
				color:transparent;
				border-top: solid rgb(255, 255, 255) 2px;
				width:50px;
				transform: rotate(-45deg);
				top:35px;
				left:-32px;
			}
			#labels>div.grey { background-color: grey; }
			#labels>div.green { background-color: rgb(27, 191, 93); }
			#labels>div.red { background-color: rgb(255, 63, 33); }
			#labels>div.yellow { background-color: rgb(255, 180, 40); }
			#labels>div.blue { background-color: rgb(72, 72, 255); }

			#labels>div.grey:before { border-top-color: grey; }
			#labels>div.green:before { border-top-color: rgb(27, 191, 93); }
			#labels>div.red:before { border-top-color: rgb(255, 63, 33); }
			#labels>div.yellow:before { border-top-color: rgb(255, 180, 40); }
			#labels>div.blue:before { border-top-color: rgb(72, 72, 255); }

			#labels>div.mirror {
				left: -136px;
			}

			#labels>div.mirror:before {
				transform: rotate(45deg);
				top:35px;
				left:43px;
			}
			#vitalics {
				/* font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; */
				position: fixed;
				padding:1em;
				line-height: 15px;
				z-index: 99;
			}
			#vitalics div {
				display: inline-block;
			}
			#vitalics progress {
				background-color:black;
			}
			#vitalics progress::-webkit-progress-value, #vitalics progress.high::-webkit-progress-value { background: rgb(50, 220, 50); }
			#vitalics progress.normal::-webkit-progress-value { background: rgb(72, 72, 255); }
			#vitalics progress.medium::-webkit-progress-value { background: rgb(255, 180, 40); }
			#vitalics progress.low::-webkit-progress-value { background: rgb(255, 63, 33); }

			/* Animate progress bar changes */
			#vitalics progress::-webkit-progress-value { transition: width 333ms ease-out, background-color 333ms ease-out; }

			.vitalHealth { width: 70px; line-height: 32px; }
			.vitalStamina,
			.vitalThirst,
			.vitalExhaustion { width: 70px; font-size:10px; text-align: center; }

			#vitalHealth { width: 147px; line-height: 32px; }
			#vitalStamina,
			#vitalThirst,
			#vitalExhaustion { width: 70px; height: 7px; }

			.time {
				position: fixed;
				bottom: 0;
				left: 0;
				padding:1em;
				pointer-events: none;
				user-select: none;
				z-index: 99;
			}

			.ded {
				position: fixed;
				top: 0;
				left: 0;
				width:100%;
				height:100%;
				pointer-events: none;
				user-select: none;
				display: none;
				align-items: end;
				justify-content: center;
				z-index: 99;
			}
			.ded div {
				font-size:1.3em;
				padding:.4em;
				margin:.4em;
				color:white;
				font-weight:800;
				background-color:rgb(255, 63, 33);
			}
		</style>
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> ELCH Sz 42 Test<br />
			BOAR
		</div>

		<div id="ded" class="ded"><div>End of epoch</div></div>
		<div id="time" class="time">Loading..</div>
		<div id="labels" style="overflow: hidden; width: 100%; height: 100%; position: fixed; z-index: 1; pointer-events: none;"></div>
		<div id="vitalics">
			<div class="vitalHealth">HEALTH</div> <progress id="vitalHealth" class="" min='0' max='100' value='95'></progress>
			<br>
			<progress id="vitalStamina" class="normal" min='0' max='100' value='77'></progress>
			<progress id="vitalThirst" class="medium" min='0' max='100' value='50'></progress>
			<progress id="vitalExhaustion" class="medium" min='0' max='100' value='55'></progress>
			<br>
			<div class="vitalStamina">STAMINA</div>
			<div class="vitalThirst">THIRST</div>
			<div class="vitalExhaustion">EXHAUSTION</div>
		</div>

		<!-- Import maps polyfill -->
		<!-- Remove this when import maps will be widely supported -->
		<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import Stats from './jsm/libs/stats.module.js';

			import { GUI } from './jsm/libs/lil-gui.module.min.js';
			import { OrbitControls } from './jsm/controls/OrbitControls.js';
			import { FBXLoader } from './jsm/loaders/FBXLoader.js';

			let camera, scene, renderer, stats;

			const clock = new THREE.Clock();
			const effectController = {"SlowMo" :0};
			let boundingBox = {"Boundingbox" :false};
			let boundingBoxesWhereOn = false;

			// FPS stats true or false
			const enableStats = false;

			
			let mixer, mixer2, mixer3, mixer4, mixer6;

			

			// Reihenfolge bestimmt welches label wo ist
			let labels =      ["FIRE",   "AGENT", "BOAR",   "GRENADE"];
			let labelColors = ["yellow", "yellow",  "blue", "red"];
			let labelLeft =   [true,     false,   false,    true];

			let explosionStage = 'idle';
			let hideTheWorld = false;

			init();
			animate();

			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.01, 15000 );
				camera.position.set( 500, 2000, 2000 );
		

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x000000 );
				scene.fog = new THREE.Fog( 0x333333, 100, 5000 );

				// lights

				const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444 );
				hemiLight.position.set( 0, 2000, 0 );
				scene.add( hemiLight );

				const dirLight = new THREE.DirectionalLight( 0xffffff );
				dirLight.position.set( 0, 2000, 1000 );
				dirLight.castShadow = true;
				dirLight.shadow.camera.top = 180;
				dirLight.shadow.camera.bottom = - 100;
				dirLight.shadow.camera.left = - 120;
				dirLight.shadow.camera.right = 120;
				scene.add( dirLight );

				// materials

				const material1 = new THREE.MeshPhysicalMaterial( {	color: 0x4d4732, wireframe:true } );
				const charactermaterial = new THREE.MeshPhysicalMaterial( {	color: 0x6666ff, wireframe:false, emissive: 0x6655ff, emissiveIntensity:1} );
				const charactermaterial2 = new THREE.MeshPhysicalMaterial( {	color: 0xff6600 , wireframe:false, emissive: 0xff6600, emissiveIntensity:1} );
				const plantsmaterial = new THREE.MeshPhysicalMaterial( {	color: 0x42803e, wireframe:true } );
				const firematerial = new THREE.MeshPhysicalMaterial( {color:0xdbfc03, wireframe:true});
				const boundingboxmaterial = new THREE.MeshPhysicalMaterial( {color: 0xffffff, wireframe:true});
				const explosionmaterial = new THREE.MeshPhysicalMaterial( {color: 0xdbfc03, transparent:true, opacity:1 });
	
			
				// Scenery

				const loader = new FBXLoader();
				loader.load( 'models/fbx/boar_Land2.fbx', function ( object ) {
					mixer4 = new THREE.AnimationMixer( object );

					mixer4.timeScale = 0;

					const action4 = mixer4.clipAction( object.animations[ 0 ] );
					action4.play();
	
					object.traverse( function ( child ) {

						if ( child.isMesh ) {
							child.material = material1;
							child.frustumCulled = false;

						}
					} );
					
					scene.add( object );
					
				} );

				const loader1 = new FBXLoader();
				loader1.load( 'models/fbx/boar_Plants.fbx', function ( object3 ) {
				
					object3.traverse( function ( child ) {

						if ( child.isMesh ) {
						child.material = plantsmaterial;

						}
					} );
					
					scene.add( object3 );
					
				} );


				//Fire

				const firegeometry = new THREE.ConeGeometry( 80, 80, 4, 1 );
				const fire = new THREE.Mesh( firegeometry, firematerial );
				scene.add( fire );
				fire.position.x = 100;
				fire.position.y = 70;

				//Animation 1

				const loader2 = new FBXLoader();
				loader2.load('models/fbx/bonesTest5Out_1.fbx', function ( object2 ) {

					mixer = new THREE.AnimationMixer( object2 );

					//Animationsgeschwindigkeit am Anfang
					mixer.timeScale = 0;
					

					const action = mixer.clipAction( object2.animations[ 0 ] );
					action.play();
					
					object2.traverse( function ( child ) {
						if ( child.isMesh ) {
							
							child.material = charactermaterial;
							child.frustumCulled = false;
							
						}
					
					} );
					scene.add( object2 );
				});
				
				//Animation 2

				const loader3 = new FBXLoader();
				loader3.load('models/fbx/bonesTest5Out_2.fbx', function ( object5 ) {

					mixer2 = new THREE.AnimationMixer( object5 );

					//Animationsgeschwindigkeit am Anfang
					mixer2.timeScale = 0;
					

					const action2 = mixer2.clipAction( object5.animations[ 0 ] );
					action2.play();
					
					object5.traverse( function ( child ) {
						if ( child.isMesh ) {
							
							child.material = charactermaterial2;
							child.frustumCulled = false;
							
						}
					
					} );
					scene.add( object5 );
				});

				//Explosion
				
				const loader4 = new FBXLoader();
				loader4.load('models/fbx/boar_explosion.fbx', function ( object4 ) {

					mixer3 = new THREE.AnimationMixer( object4 );

					//Animationsgeschwindigkeit am Anfang
					mixer3.timeScale = 0;
					

					const action3 = mixer3.clipAction( object4.animations[ 0 ] );
					action3.play();
					
					object4.traverse( function ( child ) {
						if ( child.isMesh ) {
							
							child.material = explosionmaterial;
							child.frustumCulled = false;
							
						}
					
					} );
					scene.add( object4 );
				});

				const loader6 = new FBXLoader();
				loader6.load('models/fbx/boar_boundingbox.fbx', async function ( object6) {

					mixer6 = new THREE.AnimationMixer( object6 );
					mixer6.timeScale = 0;
					

					const action6 = mixer6.clipAction( object6.animations[ 0 ] );
					action6.play();
					
					object6.traverse( function ( child ) {
						if ( child.isMesh ) {
							
							child.material = boundingboxmaterial;
							child.frustumCulled = false;
						}
				

					} );
					scene.add( object6 );
					// Nicht sichtbar am Anfang
					object6.visible = false;
					// once loading of bounding boxes is finished, set up labels
					// createTextLabels('Boar', 7);
					createBoundBoxesLabels();


					
				});

				function createBoundBoxesLabels () {
					//BoundingBoxes & labels
					const labelContainerElem = document.querySelector('#labels');

					// Make diov for every label
					for(let i = 0; i < labels.length; i++) {
						let elem = document.createElement('div');
						elem.textContent = labels[i];
						elem.id = "label-"+i;
						elem.classList.add(labelColors[i]);
						if(labelLeft[i]) elem.classList.add("mirror");
						labelContainerElem.prepend(elem);
					}
				}

				renderer = new THREE.WebGLRenderer( { antialias: false } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				container.appendChild( renderer.domElement );

				const controls = new OrbitControls( camera, renderer.domElement );
				
				//Mittelpunkt von Kamerasicht
				controls.target.set( -1200, -400, 0 );
				controls.update();

				const gui = new GUI( {} );
				gui.domElement.id = 'gui';
				
				// Slider: Fast-reverse, reverse, pause, play, f-forward
				gui.add({"Scrubbing": 0}, 'Scrubbing', -3, 3).step(1).onChange(
					function (value) {
						if(value === -2) value = -5;  // Make -2 go faster
						if(value === 2) value = 5;    // Make  2 go faster
						if(value === -3) value = -10;  // Make -3 go brrr
						if(value === 3) value = 10;    // Make  3 go brrr
						modifyTimeScale(value);
					}
				);

				// Checkbox: Play / Pause
				gui.add({"Play / Pause": false}, "Play / Pause").onChange( modifyTimeScale );

				// Checkbox: Reverse play or pause
				gui.add({"Reverse": false}, "Reverse").onChange(
					function (value) {
						modifyTimeScale(value ? -1 : 0);
					}
				);

				// Checkbox: Pause
				gui.add({"Pause": false}, "Pause").onChange( function () { modifyTimeScale(false) } );
				
				// Slider: Scrubbing
				gui.add(effectController, 'SlowMo', -.2, .2).onChange( modifyTimeScale );

				// Checkbox: Fast forward
				gui.add({"Fast forward": false}, "Fast forward").onChange( 
					function (value) {
						modifyTimeScale(value ? 10 : 0);
					}
				);
				
				// Checkbox: Fast reverse
				gui.add({"Fast reverse": false}, "Fast reverse").onChange( 
					function (value) {
						modifyTimeScale(value ? -10 : 0);
					}
				);

				//Checkbox Boundingbox
				gui.add(boundingBox, "Boundingbox").onChange(
					function (value) {
						showBoundingbox(value);
						showTextLabels(value);
					}
				);

				window.addEventListener( 'resize', onWindowResize );

				// stats
				if(enableStats) {
					stats = new Stats();
					container.appendChild( stats.dom );
				}



			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}


			// Abspielgeschwindigkeit festlegen

			function modifyTimeScale( speed ) {
				mixer.timeScale = speed;
				mixer2.timeScale = speed;
				mixer3.timeScale = speed;
				mixer4.timeScale = speed;
				mixer6.timeScale = speed;
			}
			

			function showBoundingbox (visibility) {
				/*
					scene.children[0] => hemisphereLight (name='')
					scene.children[1] => directionalLight (name='')
					scene.children[2] => feuerstelle (name='')
					scene.children[3] => irgendwie auch licht (name=land)
					scene.children[4] => untergrund/bocen & fort (name=Explosions)
					scene.children[5] => boundingboxes (name=boundingbox)
					scene.children[6] => bäume (name=plants)
					scene.children[7] => "sonny" (name=1)
					scene.children[8] => "das wesen" (name=2)
				*/

				// Hardcoded - index '5' changes when new objects/meshes/whatever are added
				// scene.children[5].visible = visibility;

				// Search object scene.children where name is 'boundingbox'
				scene.children[scene.children.map(function(e) { return e.name; }).indexOf('boundingbox')].visible = visibility;
			}

			function showTextLabels(value) {
				if(value) {
					document.getElementById('labels').style.display = 'block';
				} else {
					document.getElementById('labels').style.display = 'none';
				}
			}
	


			function animate() {


				requestAnimationFrame( animate );

				const delta = clock.getDelta();

				if ( mixer ) mixer.update( delta );
				if ( mixer2 ) mixer2.update( delta );
				if ( mixer3 ) mixer3.update( delta );
				if ( mixer4 ) mixer4.update( delta );
				if ( mixer6 ) mixer6.update( delta );

				renderer.render( scene, camera ) ;

				if(mixer) {
					// document.getElementById('time').innerHTML = `Current time: ${new Date((1715781615 + mixer.time)*1000).toISOString()}`;
					document.getElementById('time').innerHTML = `Timestamp: ${((1715781615 + mixer.time)*1000).toFixed(6)}ms | Frame: ${mixer.time.toFixed(2)}`;
				}

				updateLabels();
				updateHealth();

				if(enableStats) {
					stats.update();
				}
			}

			document.onkeydown = function (e) {
				if (e.key === "r") {
					camera.position.set(300, 600, 600);
					/*camera.rotation.set(1, 1, 1);*/
				} else if (e.key === "e") {
					camera.position.set(400, 800, 800);
				} else if (e.key === "p") {
					scene.background = new THREE.Color( 0xff00d0 );
				}
			}

			document.onkeyup = function (f) {
				if (f.key === "p") {
					scene.background = new THREE.Color( 0x000000 );
				}
			}

			function updateHealth() {
				let objectToFollow = scene.children[scene.children.map(function(e) { return e.name; }).indexOf('Explosions')];
				let explosion = objectToFollow?.children[0].scale.x;
				// console.log(explosion);
				let thresholdPause = 16;  // biggetst & best is 20, but when scrubbing with tempo "3" it will skip
				if((explosion >= thresholdPause || explosion == 0) && explosionStage == 'idle') {
					// is exploding - change stats once
					document.getElementById('vitalHealth').value=2;
					document.getElementById('vitalHealth').classList.add('low');
					document.getElementById('vitalStamina').value=2;
					document.getElementById('vitalStamina').classList.add('low');
					document.getElementById('vitalThirst').value=2;
					document.getElementById('vitalThirst').classList.add('low');
					document.getElementById('vitalExhaustion').value=2;
					document.getElementById('vitalExhaustion').classList.add('low');
					explosionStage = 'exploding';
					console.log("hide & pause");
					
					// scene.visible=false;
					modifyTimeScale(false);  // pause animation
					document.getElementsByTagName('canvas')[0].style.opacity = "0";
					document.getElementById('time').style.color = "black";
					document.getElementById('vitalics').style.color = "black";
					
					document.getElementById('ded').style.display = "flex";
					document.getElementById('labels').style.display = 'none';
					// boundingBox["Boundingbox"] = false;
					boundingBoxesWhereOn = boundingBox["Boundingbox"];
					showBoundingbox(false);
					showTextLabels(false);

				} else if(explosion <= thresholdPause && explosion > 0 && explosionStage === 'exploding') {
					// is not exploding - reset to initial values once
					document.getElementById('vitalHealth').value=95;
					document.getElementById('vitalHealth').classList.remove('low');
					document.getElementById('vitalStamina').value=77;
					document.getElementById('vitalStamina').classList.remove('low');
					document.getElementById('vitalThirst').value=50;
					document.getElementById('vitalThirst').classList.remove('low');
					document.getElementById('vitalExhaustion').value=55;
					document.getElementById('vitalExhaustion').classList.remove('low');
					document.getElementById('time').style.color = "white";
					document.getElementById('vitalics').style.color = "white";
					explosionStage = 'idle';
				}

				// The scale of the explosion is set to 0 only AFTER
				//   explosion happened; reset on start of animation.
				// console.log(explosion);
				// if(explosion === 0 && !hideTheWorld) {
				if(explosionStage === "exploding") {
					hideTheWorld = true;
					/* console.log("hide");
					// scene.visible=false;
					modifyTimeScale(false);  // pause animation
					document.getElementsByTagName('canvas')[0].style.opacity = ".4";
					hideTheWorld = true;
					document.getElementById('ded').style.display = "flex";
					document.getElementById('labels').style.display = 'none';
					// boundingBox["Boundingbox"] = false;
					boundingBoxesWhereOn = boundingBox["Boundingbox"];
					showBoundingbox(false);
					showTextLabels(false); */
				} else if(explosion != 0 && hideTheWorld) {
					// If not after explosion, make & keep visible
					hideTheWorld = false;
					console.log("show");
					/* scene.visible=true; */
					document.getElementsByTagName('canvas')[0].style.opacity = "1";
					// Hide message
					document.getElementById('ded').style.display = "none";
					showBoundingbox(boundingBoxesWhereOn);
					showTextLabels(boundingBoxesWhereOn);
				}
			}


			function updateLabels() {
				const tempV = new THREE.Vector3();
				for(let i = 0; i < labels.length; i++) {					
					const elem = document.getElementById('label-'+i);
					
					// get the position of the center of the cube
					let objectToFollow = scene.children[scene.children.map(function(e) { return e.name; }).indexOf('boundingbox')];
					if(objectToFollow) {  // Objects may not yet exist
						objectToFollow.children[i].updateWorldMatrix(true, false);
						objectToFollow.children[i].getWorldPosition(tempV);
					
						// get the normalized screen coordinate of that position
						// x and y will be in the -1 to +1 range with x = -1 being
						// on the left and y = -1 being on the bottom
						tempV.project(camera);
						
						// convert the normalized position to CSS coordinates
						const x = (tempV.x *  .5 + .5) * renderer.domElement.clientWidth;
						const y = (tempV.y * -.5 + .5) * renderer.domElement.clientHeight;

						if(parseInt(objectToFollow.children[i].position.x) == -1261) {
							elem.style.display = 'none';
						} else {
							elem.style.display = 'block';
						}
						
						// move the elem to that position
						// elem.style.transform = `translate(-50%, -50%) translate(${x}px,${y}px)`;
						elem.style.transform = `translate(-50%, -50%) translate(${x+70}px,${y-46}px)`;
					}

				};
			}
		</script>

	</body>
</html>
