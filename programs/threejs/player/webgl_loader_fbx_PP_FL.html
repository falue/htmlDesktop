<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - FBX loader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">

		<style>#camera-vectors {
			position: absolute;
			top: 0;
			right: 0;
			background: grey;
			padding: 8px;
			color: white;
		  }
		</style>
	</head>

	<body>
		<div id="camera-vectors">
			<span>Free Camera Vectors:</span><br>
			<span id="position"></span><br>
			<span id="lookingAt"></span>
		  </div>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - FBXLoaderTestPP<br />
			MIAUMIAU

		<!-- Import maps polyfill -->
		<!-- Remove this when import maps will be widely supported -->
		<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import Stats from './jsm/libs/stats.module.js';

			/* import { OrbitControls } from './jsm/controls/OrbitControls.js'; */
			import { FBXLoader } from './jsm/loaders/FBXLoader.js';
			import { FlyControls } from './jsm/controls/FlyControls.js'

			let camera, scene, renderer, stats;
			
			let cameraDirection = new THREE.Vector3();
			let camPositionSpan, camLookAtSpan;

			const clock = new THREE.Clock();

			let mixer;

			init();
			animate();

			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				/* camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 2000 );
				camera.position.set( 400, 600, 600 ); */


				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				container.appendChild( renderer.domElement );

				// FreeFly camera
				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 500);
  				camera.position.set(0, 75, 160);
				camPositionSpan = document.querySelector("#position");
  				camLookAtSpan = document.querySelector("#lookingAt");
				  // Initiate FlyControls with various params
				const controls = new FlyControls( camera, renderer.domElement );
				controls.movementSpeed = 100;
				controls.rollSpeed = Math.PI / 24;
				controls.autoForward = false;
				controls.dragToLook = true;

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x000000 );
				scene.fog = new THREE.Fog( 0x000000, 200, 2000 );

				const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444 );
				hemiLight.position.set( 0, 200, 0 );
				scene.add( hemiLight );

				const dirLight = new THREE.DirectionalLight( 0xffffff );
				dirLight.position.set( 0, 200, 100 );
				dirLight.castShadow = true;
				dirLight.shadow.camera.top = 180;
				dirLight.shadow.camera.bottom = - 100;
				dirLight.shadow.camera.left = - 120;
				dirLight.shadow.camera.right = 120;
				scene.add( dirLight );

				// scene.add( new THREE.CameraHelper( dirLight.shadow.camera ) );

				// ground
				const mesh = new THREE.Mesh( new THREE.PlaneGeometry( 2000, 2000 ), new THREE.MeshPhongMaterial( { color: 0x222222, depthWrite: false } ) );
				mesh.rotation.x = - Math.PI / 2;
				mesh.receiveShadow = true;
				scene.add( mesh );

				// materials
				const material1 = new THREE.MeshPhysicalMaterial( {	color: 0xff0000, metallness: 0, } );
				
				// model
				const loader = new FBXLoader();
				loader.load( 'models/fbx/bonesTest3out.fbx', function ( object ) {
				
					mixer = new THREE.AnimationMixer( object );

					const action = mixer.clipAction( object.animations[ 0 ] );
					action.play();
					
					object.traverse( function ( child ) {

						if ( child.isMesh ) {
							child.material = material1;
							child.castShadow = true;
							child.receiveShadow = true;

						}

					} );
					
					scene.add( object );

				} );


				/* const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 100, 0 ); */
				controls.update(); 

				window.addEventListener( 'resize', onWindowResize );

				// stats
				stats = new Stats();
				container.appendChild( stats.dom );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate() {

				requestAnimationFrame( animate );

				const delta = clock.getDelta();

				if ( mixer ) mixer.update( delta );

				renderer.render( scene, camera );

				controls.update(0.01) // ???
				updateRelativeCamera();

				stats.update();


			}

			function updateRelativeCamera() {
				// 5. calculate and display the vector values on screen
				// this copies the camera's unit vector direction to cameraDirection
				camera.getWorldDirection(cameraDirection)
				// scale the unit vector up to get a more intuitive value
				cameraDirection.set(cameraDirection.x * 100, cameraDirection.y * 100, cameraDirection.z * 100)
				// update the onscreen spans with the camera's position and lookAt vectors
				camPositionSpan.innerHTML = `Position: (${camera.position.x.toFixed(1)}, ${camera.position.y.toFixed(1)}, ${camera.position.z.toFixed(1)})`
				camLookAtSpan.innerHTML = `LookAt: (${(camera.position.x + cameraDirection.x).toFixed(1)}, ${(camera.position.y + cameraDirection.y).toFixed(1)}, ${(camera.position.z + cameraDirection.z).toFixed(1)})`
			}

		</script>

	</body>
</html>
