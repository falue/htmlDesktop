<!DOCTYPE html>
  <head>
    <meta charset="UTF-8" />
    <title>CHARTS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- style and script resources -->
    <link rel="stylesheet" type="text/css" href="../../tools/fonts.css" media="all">
    <link rel="stylesheet" href="../../tools/general.css" media="all">
    <link rel="stylesheet" href="../../tools/desktop.css" media="all">
    <link rel="stylesheet" href="stylesheet.css" media="all">
    <script src="../../tools/general.js"></script>
    <script src="javascript.js"></script>

  </head>
  <body onload="setup();" onkeydown="parent.keyboardController(event);">
    <div onclick="show('settings');" class="padding2 fixed top right" style="z-index: 665;">
    </div>
    <div id="settings" class="radius3 blackBg shadow white greyBorder margin1 padding1 fixed top right hide" style="z-index: 666;">
      <!-- bg color -->
      Background color
      <br>
      <div class="systemButton inline" >
        <input id="colorPickerBg" class="valign" type="color" value="#00ff00" oninput="setBgColor(this.value);">
      </div>
      <button class="systemButton" onclick="setBgColor('#00ff00');">green</button>
      <button class="systemButton" onclick="setBgColor('#0000ff');">blue</button>
      <button class="systemButton" onclick="setBgColor('#ffffff');">white</button>
      <button class="systemButton" onclick="setBgColor('#7f7f7f');">grey 50%</button>
      <button class="systemButton" onclick="setBgColor('#222222');">darkgrey</button>
      <button class="systemButton" onclick="setBgColor('#000000');">black</button>
      <button class="systemButton" onclick="setBgColor('#ff00ff');">pink</button>
      <button class="systemButton" onclick="toggleChess();">chess</button>
      <br>
      <br>

      <!-- which pattern of marker is displayed -->
      pattern
      <br>
      <button class="systemButton" onclick="prevPattern();">prev pattern</button>
      <button class="systemButton" onclick="nextPattern();">next pattern</button>
      <br>
      <br>

      <!-- which marker is used -->
      Marker icon style<br>
      <button class="systemButton" onclick="prevStyle();">prev style</button>
      <button class="systemButton" onclick="nextStyle();">next style</button>
      <button class="systemButton" onclick="markerIndex = 1; createCells(patternIndex);" class="small"><img src='tools/marker.svg' alt='' style="width:1em;"></button>
      <button class="systemButton" onclick="markerIndex = 2; createCells(patternIndex);">&#9650;</button>
      <button class="systemButton" onclick="markerIndex = 3; createCells(patternIndex);">&#9709;</button>
      <button class="systemButton" onclick="markerIndex = 4; createCells(patternIndex);">&middot;</button>
      <button class="systemButton" onclick="markerIndex = 5; createCells(patternIndex);">+</button>
      <button class="systemButton" onclick="markerIndex = 6; createCells(patternIndex);">&times;</button>
      <br>
      <br>

      <!-- marker size -->
      Marker size
      <br>
      <button class="systemButton" onclick="changeFontSize();">increase</button>
      <button class="systemButton" onclick="changeFontSize(true);">reset</button>
      <br>
      <br>
      
      <!-- marker color -->
      Marker color
      <br>
      <div class="systemButton inline" >
        <input id="colorPickerMarker" class="valign" type="color" value="#000000" oninput="setMarkerColor(this.value);">
      </div>
      <button class="systemButton" onclick="setMarkerColor('#00ff00');">green</button>
      <button class="systemButton" onclick="setMarkerColor('#0000ff');">blue</button>
      <button class="systemButton" onclick="setMarkerColor('#ffffff');">white</button>
      <button class="systemButton" onclick="setMarkerColor('#7f7f7f');">grey</button>
      <button class="systemButton" onclick="setMarkerColor('#222222');">darkgrey</button>
      <button class="systemButton" onclick="setMarkerColor('#000000');">black</button>
      <button class="systemButton" onclick="setMarkerColor('#ff00ff');">pink</button>

      <br>
      <br>
      <hr>
      <br>
      <button class="systemButton" onclick="hide('settings');">close</button>
      <button class="systemButton" onclick="window.history.back();">back</button>

    </div>

    <div id="container" class="gridLayout"><!-- helperLines -->
    </div>

  </body>
  </html>
