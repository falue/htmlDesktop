<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PLAYBACK</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body,
        html {
            padding: 0;
            margin: 0;
            background-color: black;
            height: 100%;
            color: white;
        }

        body {
            display: flex;
            box-orient: horizontal;
            background: #333;
            color: white;
        }

        aside {
            width: 420px;
            background: #444;
        }

        aside div {
            padding: 5px 20px;
            width: 420px;
            border-bottom: 1px solid #222;
            border-top: 1px solid #888;
            transition: background 0.3s ease;
        }

        aside div:first-child {
            padding-top: 20px;
        }

        aside div:last-child {
            border-radius: 0 0 4px 0;
        }

        aside div:hover {
            background: #666;
        }

        label {
            display: block;
            font: 13px "Helvetica", sans-serif;
            color: white;
        }

        strong {
            font-weight: bold;
            padding: 0 3px;
            user-select: none;
        }

        code {
            display: inline-block;
            font: 12px "Courier new";
            float: right;
        }

        video,
        select,
        button:focus, button:active,
        input:focus, input:active {
            outline: none;
        }

        select, input, button {
            background: #777;
            width: 100%;
            height: 20px;
            border: none;
            color: white;
        }

        input, button {
            appearance: none !important;
        }

        select:hover, input:hover, button:hover {
            background: #999;
            cursor: pointer;
        }

        input[type="range"]:hover {
            cursor: col-resize;
        }

        .hide {
            display: none !important;
        }

        button.small {
            width: auto;
        }

        button.medium {
            width: auto;
            min-width: 50px;
            margin: 0.5em 0;
        }

        input::-webkit-slider-thumb {
            appearance: none !important;
            width: 32px;
            height: 20px;
            background: #111;
            border-radius: 3px;
        }

        section {
            box-flex: 1;
            padding: 0;
            background: #333;
            overflow: hidden;
            width: 100%;
        }

        video {
            position: absolute;
            width: 100%;
            height: auto;
            background: black;
            z-index: 2;
        }

        video.noControls {
            cursor: none;
        }

        .menu-hidden {
            position: fixed;
            top:0;
            left: 0;
            width: 40px;
            height: 40px;
            z-index: 3;
        }

        .small {
        font-size: 0.75em;
        }

        /* hide controls in fullscreen*/
        .noControls .custom-video-controls {
            z-index: 2147483647;
        }

        video.noControls::-webkit-media-controls-enclosure {
            display: none !important;
        }

        video.noControls::-webkit-media-controls {
            display: none !important;
        }

        .noControls::-webkit-media-controls {
            display: none !important;
        }
    </style>

    <script>
        let timeout;
        let timeoutSpeedChange;

        // Feel free to fork and improve on this if you'd like
        function setColors() {
            let speed = document.getElementById("speed").value;
            let blur = document.getElementById("blur").value;
            let saturate = document.getElementById("saturate").value;
            let hue = document.getElementById("hue").value;
            let brightness = document.getElementById("brightness").value;
            let contrast = document.getElementById("contrast").value;
            let invert = document.getElementById("invert").value;
            let sepia = document.getElementById("sepia").value;

            let filters = "blur(" + blur + "px) saturate(" + saturate + ") hue-rotate(" + hue + "deg) brightness(" + brightness + "%) contrast(" + contrast + ") invert(" + invert + ") sepia(" + sepia + ")";
            document.getElementById("video").style.webkitFilter = filters;
            document.getElementById("video").style.filter = filters;
            changeSpeed(speed);

            document.getElementById("speed-val").innerHTML = speed/10;
            document.getElementById("blur-val").innerHTML = blur;
            document.getElementById("saturate-val").innerHTML = saturate;
            document.getElementById("hue-val").innerHTML = hue;
            document.getElementById("brightness-val").innerHTML = brightness;
            document.getElementById("contrast-val").innerHTML = contrast;
            document.getElementById("invert-val").innerHTML = invert;
            document.getElementById("sepia-val").innerHTML = sepia;
        }

        function toggleClass(id, className) {
            let element = document.getElementById(id);
            element.classList.toggle(className);
        }

        function changeSpeed(value) {
            value /= 10;
            document.getElementById("speed-val").innerHTML = value;
            let video = document.getElementById("video");

            //console.log(timeout, timeoutSpeedChange);

            if(value <= 16) {
                // use standard browser playback speed mode

                //console.log("clear timeouts");
                clearTimeout(timeout);
                timeout = "";
                clearTimeout(timeoutSpeedChange);
                timeoutSpeedChange = "";

                video.playbackRate = value;
                if(video.paused) video.play();
            } else {
                // horsin' around
                if(!timeoutSpeedChange) {
                    timeoutSpeedChange = setTimeout(function() {
                        console.log("timeoutSpeedChange NOW!");
                        video.playbackRate = 1;
                        video.pause();
                        clearTimeout(timeout);
                        timeout = "";
                        clearTimeout(timeoutSpeedChange);
                        timeoutSpeedChange = "";
                        fasterPussycat(value);
                    }, 250);
                }
            }
        }

        function fasterPussycat(value) {
            let video = document.getElementById("video");
            let currentTime = video.currentTime;
            timeout = setTimeout(function() {
                let jump = currentTime + value/100;
                if(jump > video.duration) jump = value/100;
                //console.log(value, jump);
                video.currentTime = jump;
                fasterPussycat(value);
            }, 40);  // 40 für 25fps
        }

        function loadVideoFile(videoFile) {
            var file = videoFile.files[0];
            var type = file.type;
            var videoNode = document.querySelector('video');
            var canPlay = videoNode.canPlayType(type);
            var fileURL = URL.createObjectURL(file);
            videoNode.src = fileURL;
        }
        

        function changeSource(source) {
            document.getElementById("video").src = source;
        }
    </script>
</head>
<body>

        <button class="medium" onClick="document.getElementById('video').paused ? document.getElementById('video').play() : document.getElementById('video').pause();">Play / Pause</button>

    <div>
        <label>
            <strong>Speed</strong><code><span id="speed-val">1</span>x</code>
            <button class="small" onClick="document.getElementById('speed').value=10; setColors()" title="Set to default">default</button>
            
        </label>
        <input id="speed" type="range" value="10" min="1" max="160" onchange="changeSpeed(this.value)" oninput="changeSpeed(this.value)">
        
    </div>
    <div>
        <label>
            <strong>Blur</strong><code><span id="blur-val">0</span>px</code>
            <button class="small" onClick="document.getElementById('blur').value=0; setColors()" title="Set to default">default</button>
        </label>
        <input id="blur" type="range" min="0" max="30" step="1" value="0" oninput="setColors()"/>
    </div>
    <div>
        <label><strong>Saturation</strong><code><span id="saturate-val">1</span></code>
            <button class="small" onClick="document.getElementById('saturate').value=1; setColors()" title="Set to default">default</button>
        </label>

    </div>
    <div>

        <button class="small" onClick="document.getElementById('hue').value=0; setColors()" title="Set to default">default</button>
        </label>
        <input id="hue" type="range" min="0" max="360" step="1" value="0" oninput="setColors()"/>
    </div>
    <div>

    </div>
    <div>

        </label>

    </div>
