<!DOCTYPE html>
  <head>
    <meta charset="UTF-8" />
    <title>imageviewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- style and script resources -->
    <link rel="stylesheet" type="text/css" href="../../tools/fonts.css" media="all">
    <link rel="stylesheet" href="../../tools/general.css" media="all">
    <link rel="stylesheet" href="imageviewer.css" media="all">
    <link rel="stylesheet" href="../../tools/desktop.css" media="all">
    <script src="../../tools/general.js"></script>
    <script src="imageviewer.js"></script>
    
    <!-- VIDE JS -->
    <!-- TODO maybe add only if files contains .mp4 -->
    <link href="../../tools/libraries/video-js.css" rel="stylesheet" />

  </head>
  <body onload="setupImageViewer();" onkeydown="keyboardControllerImageViewer(event);">
    <header id="windowmenu" class="windowmenu">
      <button class="programButtons">File</button><!-- 
      --><button class="programButtons">Edit</button><!-- 
      --><button class="programButtons">Go to</button><!-- 
      --><button class="programButtons">Camera</button><!-- 
      --><button class="programButtons">Share</button><!-- 
      --><button class="programButtons">Presentation</button><!-- 
      --><button class="programButtons" onclick="toggle('settings')"><i class="material-icons blue valign small">bolt</i> View</button><!-- 
      --><button class="programButtons">About</button><!-- 
      --><button id="zoomIn" class="programButtons" onclick="zoom({wheelDeltaY: -25, wheelDeltaX: 0, offsetX: window.innerWidth/2, offsetY: window.innerHeight/2 }, getCurrentContentWrapper())"><i class="material-icons blue valign">zoom_in</i></button><!-- 
      --><button id="zoomOut" class="programButtons" onclick="zoom({wheelDeltaY: 40, wheelDeltaX: 0, offsetX: window.innerWidth/2, offsetY: window.innerHeight/2 }, getCurrentContentWrapper())"><i class="material-icons blue valign">zoom_out</i></button><!--
      --><button id="zoomReset" class="programButtons" onclick="zoom(100, getCurrentContentWrapper())"><i class="material-icons blue valign">search_off</i></button>
    </header>

    <div id="settings" class="hide radius3 fixed top right margin2 padding1 whiteBg shadow" style="z-index:9999">
      <p class="grey">Settings</p>
      <fieldset class="radius3">
        <legend>Upload images</legend>
        <input id="fileinput" class="" type="file" accept="image/png, image/gif, image/jpeg, application/pdf" onchange="uploadImages(this)" multiple>
      </fieldset>
      <fieldset class="radius3">
        <legend>Content</legend>
        <input id="disableVideoControls" type="checkbox" class="small" style="margin-right:.5em; transform: translateY(.25em)" onchange="disableVideoControls = this.checked; setVideoControls()">
        <label for="disableVideoControls">Video: Hide Controls</label><br>
        <input id="allowZoom" type="checkbox" class="small" style="margin-right:.5em; transform: translateY(.25em)" onchange="toggleZoom(this.checked)">
        <label for="allowZoom">Allow zoom</label><br>
        <input id="letterbox" type="checkbox" class="small" style="margin-right:.5em; transform: translateY(.25em)" onchange="toggleLetterbox(this.checked)" checked>
        <label for="letterbox">Images: Letterboxed</label>
      </fieldset>
      <fieldset class="radius3">
        <legend>Keyboard</legend>
        [left arrow]: prev image / start video from beginning<br>
        [right arrow]: next image<br>
        [space]: Video play/pause<br>
        [f] fullscreen image gallery
      </fieldset>
      <button class="systemButton" onclick="hide('settings');">CLOSE SETTINGS</button>
     </div>

     <div class="imageNavigation right" onclick="navigateGallery(1); event.stopPropagation()"></div>
     <div class="imageNavigation left" onclick="navigateGallery(-1); event.stopPropagation()"></div>

    <div id="content" class="content" onclick="navigateGallery(1);" onmousewheel="zoom(event, 'content')">
    </div>

    <!-- TODO maybe add only if files contains .mp4 -->
    <div id="videoPlayer" class="videoPlayer hide overflowHidden" onclick="playWithDisabledControls()" onmousewheel="zoom(event, 'videoJsPlayerWrapper_html5_api')">
      <video
          id="videoJsPlayerWrapper"
          class="video-js vjs-default-skin"
          controls
          preload="auto"
          data-setup='{ "inactivityTimeout": 0, "fluid": true }'
          >
          <!-- <source id="videoSrcMp4"> -->
        </video>
    </div>
    <div id="thumbnails" class="thumbnails noScrollbar">
    </div>


    <!-- VIDEOJS -->
    <!-- TODO maybe add only if files contains .mp4 -->
    <script src="../../tools/libraries/video.min.js"></script>
  </body>
  </html>
