<!DOCTYPE html>
  <head>
    <meta charset="UTF-8" />
    <title>imageviewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- style and script resources -->
    <link rel="stylesheet" type="text/css" href="../../tools/fonts.css" media="all">
    <link rel="stylesheet" href="../../tools/general.css" media="all">
    <link rel="stylesheet" href="imageviewer.css" media="all">
    <link rel="stylesheet" href="../../tools/desktop.css" media="all">
    <script src="../../tools/general.js"></script>
    <script src="imageviewer.js"></script>

    <!-- VIDE JS -->
    <!-- TODO maybe add only if files contains .mp4 -->
    <link href="../../tools/libraries/video-js.css" rel="stylesheet" />

  </head>
  <body onload="setupImageViewer();" onkeydown="keyboardController(event);">
    <header class="windowmenu">
      <button class="programButtons">File</button><!-- 
      --><button class="programButtons">Edit</button><!-- 
      --><button class="programButtons">Go to</button><!-- 
      --><button class="programButtons">Camera</button><!-- 
      --><button class="programButtons">Share</button><!-- 
      --><button class="programButtons">Presentation</button><!-- 
      --><button class="programButtons">View</button><!-- 
       --><button class="programButtons">About</button>
    </header>

    <div id="content" class="content" onclick="navigateGallery(1);">
      <div class="imageNavigation left" onclick="navigateGallery(-1); event.stopPropagation()"></div>
      <div class="imageNavigation right" onclick="navigateGallery(1); event.stopPropagation()"></div>
    </div>

    <!-- TODO maybe add only if files contains .mp4 -->
    <div id="videoPlayer" class="videoPlayer hide">
      <video
          id="videoJsPlayerWrapper"
          class="video-js vjs-default-skin"
          controls
          preload="auto"
          data-setup='{ "inactivityTimeout": 0, "fluid": true }'
          >
          <!-- <source id="videoSrcMp4"> -->
        </video>
    </div>
    <div id="thumbnails" class="thumbnails">
    </div>


    <!-- VIDEOJS -->
    <!-- TODO maybe add only if files contains .mp4 -->
    <script src="../../tools/libraries/video.min.js"></script>
  </body>
  </html>
