<!DOCTYPE html>
  <head>
    <meta charset="UTF-8" />
    <title>filemanager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- style and script resources -->
    <link rel="stylesheet" type="text/css" href="../../tools/fonts.css" media="all">
    <link rel="stylesheet" href="../../tools/general.css" media="all">
    <link rel="stylesheet" href="filemanager.css" media="all">
    <link rel="stylesheet" href="treeview.css" media="all">
    <link rel="stylesheet" href="../../tools/desktop.css" media="all">
    <script src="../../tools/general.js"></script>
    <script src="filemanager.js"></script>
    <script src="../../tools/fileparser.js"></script>

  </head>
  <body onload="setupFileManager();" onkeydown="keyboardController(event);">
    <header class="windowmenu">
      <button class="programButtons">File..</button><!-- 
      --><button class="programButtons">Edit</button><!-- 
      --><button class="programButtons">Go to</button><!-- 
      --><button class="programButtons">Remote</button><!-- 
      --><button class="programButtons">Settings</button><!-- 
      --><button class="programButtons">Share</button><!-- 
      --><button class="programButtons">View</button><!-- 
       --><button class="programButtons">About</button>
    </header>

    <header class="fileManagerTools relative">
      <button class="win95Button radius3">
        <i class="material-icons blue valign">pivot_table_chart</i> Navigation
      </button>
      <button class="win95Button radius3">
        <i class="material-icons blue valign">visibility</i> Preview
      </button>
      <button class="win95Button radius3" onclick="gebi('folderContent').classList.toggle('listView')">
        <i class="material-icons blue valign">bolt</i> Display
      </button>
      <button class="win95Button radius3">
        <i class="material-icons blue valign">code</i> File name extensions
      </button>
      <button class="win95Button radius3">
        <i class="material-icons blue valign">more_vert</i> Options
      </button>

      <div class="fileManagerToolsRight right absolute">
        <button class="win95Button radius3">
          <i class="material-icons blue valign">feed</i>
        </button>
        <button class="win95Button radius3">
          <i class="material-icons blue valign">settings</i>
        </button>
        <button class="win95Button radius3">
          <i class="material-icons blue valign">search</i>
        </button>
      </div>
    </header>

    <header class="fileManagerPath">
      Path <i class="material-icons small rotate90 valign grey">switch_left</i>
      <i class="material-icons small valign grey">post_add</i>
      <i class="material-icons small valign grey">create_new_folder</i>
      <div id="fileManagerPath" class="grey radius3">C:/</div>
      <div class="right relative">
        <i class="material-icons valign grey">more_vert</i>
      </div>
    </header>

    <div class="browser noScrollbar">
      <!-- LOGO -->
      <div class="logo hardcodedFolders op50 grey radius10 small">
        <img id="icon-favorites" src="../../os/windows/systemIcons/computer.png" alt="">
        Desktop v1.1<br>
        © Weyland-Yutani
      </div>

      <hr>

      <!-- FAVORITES -->
      <ul class="tree hardcodedFolders">
        <li>
          <img id="icon-favorites" src="../../os/windows/systemIcons/favorites.png" alt="">
          <input id="checkbox-favorites" type="checkbox">
          <label for="checkbox-favorites" class="tree_label">Favorites</label>
          <ul>
            <li>
            <span class="tree_label">
              <img src="../../os/windows/systemIcons/folderFull.png" alt="">
              Downloads
              </span>
            </li>
            <li>
              <span class="tree_label">
                <img src="../../os/windows/systemIcons/folderFull.png" alt="">
                Pictures
              </span>
            </li>
            <li>
              <span class="tree_label">
                <img src="../../os/windows/systemIcons/folderFull.png" alt="">
                Desktop
              </span>
            </li>
            <li>
              <span class="tree_label">
                <img src="../../os/windows/systemIcons/folderFull.png" alt="">
                Var
              </span>
            </li>
          </ul>
        </li>
      </ul>

      <hr>
      
      <!-- MAIN TREE VIEW -->
      <ul id="treeView" class="tree">
      </ul>

      <hr>

      <!-- DRIVES -->
      <!-- <ul class="tree hardcodedFolders">
        <li>
          <img id="icon-drives" src="../../os/windows/systemIcons/folderFull.png" alt="">
          <input id="checkbox-drives" type="checkbox" checked>
          <label for="checkbox-drives" class="tree_label">Drives</label>
          <ul>
            <li>
            <span class="tree_label">
              <img src="../../os/windows/systemIcons/hdd.png" alt="">
              C:
              </span>
            </li>
            <li>
              <span class="tree_label">
                <img src="../../os/windows/systemIcons/hdd.png" alt="">
                E:
              </span>
            </li>
            <li>
              <span class="tree_label">
                <img src="../../os/windows/systemIcons/dvd.png" alt="">
                DVD
              </span>
            </li>
          </ul>
        </li>
      </ul> -->
      
      <hr>

      <span id="about" class="grey small italics op50">
        <br>
        About this system<br>
        by telefabi 2022
      </span>
      <br>
      <br>
      <br>
      <br>

    </div>

    <!-- FOLDER CONTENTS -->
    <div id="folderContent" class="content noScrollbar listView"></div>

    <!-- FOLDER CONTENT INFOS -->
    <div id="folderInfo" class="grey small padding05">0 files</div>

  </body>
  </html>
