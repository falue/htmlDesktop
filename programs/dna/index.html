<!DOCTYPE html>
  <head>
    <meta charset="UTF-8" />
    <title>DNA - Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- style and script resources -->
    <link rel="stylesheet" type="text/css" href="../../tools/fonts.css" media="all">
    <link rel="stylesheet" href="../../tools/general.css" media="all">
    <link rel="stylesheet" href="../../tools/desktop.css" media="all">
    <link rel="stylesheet" href="stylesheet.css" media="all">
    <script src="../../tools/general.js"></script>
    <script src="data.js"></script>
    <script src="javascript.js" defer></script>


  </head>
  <body onload="setup();" onkeydown="parent.keyboardController(event);">
    <div class="gridLayout">
      <!-- ROW 1 -->
      <div class="gridBox" style="grid-column: col / span 6; grid-row: row;">1</div>
      <div class="gridBox" style="grid-column: col 7 / span 2; grid-row: row; text-align: right;">2</div>

      <!-- ROW 2 -->
      <div class="gridBox centerContentY" style="grid-column: col; grid-row: row 2;">3</div>
      <div class="gridBox centerContentY" style="grid-column: col 2 / span 3; grid-row: row 2;">
        <div class="buttongroup">
          <button onclick="changeFontSize('dna', -1)">-</button>
          <button onclick="changeFontSize('dna', 1)">+</button>
          <button onclick="changeFontSize('dna', 0)">0</button>
        </div>
      </div>
      <div class="gridBox centerContentY" style="grid-column: col 5 / span 3; grid-row: row 2;">4.1</div>
      <div class="gridBox centerContentY" style="grid-column: col 8 / span 1; grid-row: row 2;">4.2</div>

      <!-- ROW 3 -->
      <div class="gridBox overflowAuto" style="grid-column: col / span 1; grid-row: row 3;">3.0
        more text<br>
        more text<br>
        more text<br>
        more text<br>
        more text<br>
        more text<br>
        more text<br>
      </div>
      <div class="gridBox overflowAuto" style="grid-column: col 2 / span 7; grid-row: row 3;">
        <h1>5</h1>
        <div id="dna" class="code"></div>
      </div>

      <!-- ROW 4 -->
      <div class="gridBox" style="grid-column: col / span 6; grid-row: row 4;">
        6<br>
        6<br>
        6<br>
      </div>
      <div class="gridBox" style="grid-column: col 7 / span 2; grid-row: row 4;">7</div>
    </div>

  </body>
  </html>
