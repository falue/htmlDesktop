<html>
    <head>

        <style>
            @font-face {
                font-family: 'win95';
                font-style: normal;
                font-weight: 400;
                src: url('../../../tools/fontface/w95fa.eot');
                src: url('../../../tools/fontface/w95fa.woff2') format('woff2'), 
                    url('../../../tools/fontface/w95fa.woff') format('woff');
            }
            html, body {
                background-color: green;
                font-family: win95, Verdana, Helvetica, sans-serif;
                color:white;
            }
            h1 {
                margin:0;
            }
            p {
                margin-top:0;
            }

            .blink { animation: blinker 1s linear infinite; }
            @keyframes blinker {
                0%   { opacity: 0.75; }
                49%  { opacity: 0.75; }
                50%  { opacity: 1; }
                100% { opacity: 1; }
            }
        </style>
        <script>
            function isChromium() {
                return !!window.chrome &&
                        (!!window.chrome.runtime || !!window.chrome.webstore);
                }

                async function closeWindowIfNotChromiumBased() {
                    const params = new URLSearchParams(window.location.search);
                    const windowId = params.get('windowId');

                    // Determine Chromium-ness
                    let isChromium = false;

                    if (navigator.userAgentData?.brands?.length) {
                        const brands = navigator.userAgentData.brands.map(b => b.brand);
                        isChromium = brands.includes("Chromium");
                    } else {
                        // Fallback for Safari/Firefox/older: UA sniff (coarse but effective)
                        const ua = navigator.userAgent;
                        isChromium = /Chrome\/|Chromium\//.test(ua) && !/Firefox\//.test(ua) && !/Safari\/(?!.*Chrome\/)/.test(ua);
                        // (Safari has Safari/ but no Chrome/)
                    }

                    if (isChromium) {
                        console.log("Chromium based browser used - close hint window");
                        if (typeof parent.closeWindow === "function") parent.closeWindow(windowId);
                    } else {
                        console.log("Not chromium based browser - Close all other windows, leave hint window open on display for all to see");
                        if (typeof parent.closeAllWindows === "function") {
                            //parent.closeAllWindows(windowId);
                            await parent.delay(2222);
                            parent.gebi('gpuFail').style.mixBlendMode = 'color-dodge';
                            parent.show('gpuFail');
                            await parent.delay(222);
                            parent.hide('gpuFail');
                            await parent.delay(1250);
                            parent.gebi('gpuFail').style.mixBlendMode = 'screen';
                            parent.show('gpuFail');
                            await parent.delay(1666);

                            let newText= `
                                This tool works best in google chrome (or chromium based eg opera/brave/..)
                                <br>
                                *Sucks* in safari / firefox etc - sorry!<br>
                                <br>
                                <center>
                                    <a href="https://www.google.com/chrome/" target="_blank">
                                        <img src="../../workstations/telefabi/files/chrome.png" style="width:3em; vertical-align:middle; margin:1em">
                                    </a>
                                </center>
                                <br>
                                Or click <a href="../browser/sites/telefabi" style="text-decoration:underline">here</a> for a static site & contact info
                                <br>
                                Press any key to continue`
                            parent.gebi('death-iframe').contentWindow.document.getElementById('text').innerHTML = newText;
                            parent.gebi('death-iframe').contentWindow.document.documentElement.style.cursor = 'crosshair'
                            parent.gebi('death-iframe').contentWindow.document.body.style.cursor = 'crosshair'
                            parent.setOverlayColor('DEATH');
                            
                            // Hide window as the user, after reboot, gets it now
                            parent.hide('gpuFail');
                            //parent.closeWindow(windowId);
                        }
                    }
                }
        </script>
    </head>
    <body onload="closeWindowIfNotChromiumBased();">
        <img src="chrome.png" style="width:2em; vertical-align:middle; margin-right:0.25em">
        This page works best in <span class="blink">google chrome</span> (or chromium based eg opera/brave/..)
        <br>
        <hr style="opacity:0.5">
        *Sucks* in safari / firefox etc
    </body>
</html>
